                <p>
                    hallucinari（ハルシナリ）。現代美術家。絵画、ミクストメディア、身の回りの有機的素材や生活資材を用いたインプロビゼーション的アプローチによる作品制作を行う。
                </p>
            </div>

            <div class="about-section">
                <h2>Statement</h2>
                <p>
                    日常の欲望や衝動、食や消費行動に潜む混沌としたエネルギーを、キャンバスという限られた領域において足し引きの連続で消化・再構築する。日常の無造作な事象と美術史的・文化的文脈を突発的に交差させることで、独自の造形美学を追求している。
                </p>
