<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f6; 
            color: #333;
        }
        .container { 
            width: 90%; 
            max-width: 800px; 
            margin: 4rem auto; 
            background: #ffffff; 
            padding: 3rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #2c3e50; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 0.5rem; 
            margin-top: 2rem;
        }
        .container > h2:first-child {
            margin-top: 0;
        }
        p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .nav-links { 
            display: flex; 
            flex-wrap: wrap;
            gap: 15px; 
            margin-top: 1rem; 
            margin-bottom: 1.5rem;
        }
        .nav-links a { 
            display: inline-block;
            text-decoration: none; 
            color: #3498db; 
            font-weight: bold; 
            border: 2px solid #3498db; 
            padding: 12px 20px; 
            border-radius: 6px; 
            transition: all 0.3s ease; 
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }
        .nav-links a:hover { 
            background: #3498db; 
            color: #ffffff; 
        }
        .sub-text {
            display: block;
            font-size: 0.85rem;
            font-weight: normal;
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        /* 平面作品セクション用スタイル */
        .work-group {
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }
        .work-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #34495e;
            margin: 0 0 1rem 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .work-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .work-item {
            width: 100%;
        }
        .work-item img {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border: 1px solid #eef2f5;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
                margin: 2rem auto;
                padding: 1.5rem;
            }
            .nav-links {
                flex-direction: column;
                gap: 12px;
            }
            .nav-links a {
                display: block;
                width: 100%;
                padding: 14px 16px;
            }
            .work-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>hallucinari</h2>
        <p>なんでも作ります</p>

        <h2>ATRAS Simulator</h2>
        <div class="nav-links">
            <a href="atras_latin_simulator.html">
                Atras Latin Simulator
                <span class="sub-text">A🇹🇷🇦🇸 🇱🇦t🇮🇳 🇸🇮🇲🇺🇱🇦🇹🇴r</span>
            </a>
            <a href="atras_japanese_simulator.html">
                Atras Japanese Simulator
                <span class="sub-text">A🇹🇷🇦🇸 Ja🇵🇦🇳🇪🇸🇪 🇸🇮🇲🇺🇱🇦🇹🇴r</span>
            </a>
            <a href="atras_cyrillic_simulator.html">
                Atras Cyrillic Simulator
                <span class="sub-text">A🇹🇷🇦🇸 🇨🇾r🇮🇱🇱🇮c 🇸🇮🇲🇺🇱🇦🇹🇴r</span>
            </a>
        </div>

        <h2>平面作品</h2>
        <div class="work-group">
            <div class="work-title">
                <span class="sub-text"></span>
            </div>
            <div class="work-grid">
                <div class="work-item">
                    <img src="image1.jpg" alt="D🇮🇪 Le🇮🇩en 🇩🇪s ju🇳🇬en W🇪🇷🇹🇭🇪🇷" loading="lazy">
                </div>
                <div class="work-item">
                    <img src="image2.jpg" alt="Too Many Cooks" loading="lazy">
                </div>
                <div class="work-item">
                    <img src="image3.jpg" alt="ネットヒア" loading="lazy">
                </div>
                <div class="work-item">
                    我が世界の芳醇さ
                    <img src="image4.jpg" alt="我が世界の芳醇さ" loading="lazy">
                </div>
            </div>
        </div>

        <h2>その他色々</h2>
        <div class="nav-links">
            <a href="https://linktr.ee/hallucinari" target="_blank" rel="noopener noreferrer">linktree</a>
        </div>
    </div>
</body>
</html>
