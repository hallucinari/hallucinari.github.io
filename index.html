<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f6; 
            color: #333;
        }
        .container { 
            width: 90%; 
            max-width: 800px; 
            margin: 4rem auto; 
            background: #ffffff; 
            padding: 3rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #2c3e50; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 0.5rem; 
            margin-top: 2rem;
        }
        .container > h2:first-child {
            margin-top: 0;
        }
        p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        /* ボタングループ（CSS Gridに変更） */
        .nav-links { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; 
            margin-top: 1rem; 
            margin-bottom: 1.5rem;
        }
        .nav-links a { 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none; 
            color: #3498db; 
            font-weight: bold; 
            border: 2px solid #3498db; 
            padding: 16px; 
            border-radius: 6px; 
            transition: all 0.3s ease; 
            text-align: center;
            line-height: 1.4;
        }
        .nav-links a:hover { 
            background: #3498db; 
            color: #ffffff; 
        }
        .sub-text {
            display: block;
            font-size: 0.85rem;
            font-weight: normal;
            margin-top: 8px;
            letter-spacing: 0.05em;
            word-break: keep-all; /* 絵文字の不自然な分割を防ぐ */
        }

        /* 平面作品セクション用スタイル */
        .work-group {
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }
        .work-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .work-item {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .image-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #eef2f5;
            border-radius: 10px;
            overflow: hidden; /* 画像がなくてもはみ出さない */
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border: 1px solid #eef2f5;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .work-caption {
            font-size: 0.95rem;
            color: #34495e;
            text-align: center;
            font-weight: bold;
            overflow-wrap: break-word;
        }

        /* モバイル対応 */
        @media (max-width: 600px) {
            .container {
                width: 92%;
                margin: 2rem auto;
                padding: 1.5rem;
            }
            .nav-links {
                grid-template-columns: 1fr;
            }
            .work-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>hallucinari</h2>
        <p>なんでも作ります</p>

        <h2>ATRAS Simulator</h2>
        <div class="nav-links">
            <a href="atras_latin_simulator.html">
                Atras Latin Simulator
                <span class="sub-text">A🇹🇷🇦🇸 🇱🇦t🇮🇳 🇸🇮🇲🇺🇱🇦🇹🇴r</span>
            </a>
            <a href="atras_japanese_simulator.html">
                Atras Japanese Simulator
                <span class="sub-text">A🇹🇷🇦🇸 Ja🇵🇦🇳🇪🇸🇪 🇸🇮🇲🇺🇱🇦🇹🇴r</span>
            </a>
            <a href="atras_slavic_cyrillic_simulator.html">
                Atras Slavic Cyrillic Simulator
                <span class="sub-text">A🇹🇷🇦🇸 S🇱🇦🇻🇮c 🇨🇾r🇮🇱🇱🇮c 🇸🇮🇲🇺🇱🇦🇹🇴r</span>
            </a>
        </div>

        <h2>平面作品</h2>
        <div class="work-group">
            <div class="work-grid">
                <figure class="work-item">
                    <div class="image-wrapper">
                        <img src="image1.jpg" alt="D Le en s ju en W R TH R の平面作品" loading="lazy">
                    </div>
                    <figcaption class="work-caption">D🇮🇪 Le🇮🇩en 🇩🇪s ju🇳🇬en W🇪🇷🇹🇭🇪🇷</figcaption>
                </figure>
                
                <figure class="work-item">
                    <div class="image-wrapper">
                        <img src="image2.jpg" alt="Too Many Cooks の平面作品" loading="lazy">
                    </div>
                    <figcaption class="work-caption">Too Many Cooks</figcaption>
                </figure>
                
                <figure class="work-item">
                    <div class="image-wrapper">
                        <img src="image3.jpg" alt="ネットヒア の平面作品" loading="lazy">
                    </div>
                    <figcaption class="work-caption">ネットヒア</figcaption>
                </figure>
                
                <figure class="work-item">
                    <div class="image-wrapper">
                        <img src="image4.jpg" alt="我が世界の芳醇さ の平面作品" loading="lazy">
                    </div>
                    <figcaption class="work-caption">我が世界の芳醇さ</figcaption>
                </figure>
            </div>
        </div>

        <h2>その他色々</h2>
        <div class="nav-links" style="grid-template-columns: 1fr;">
            <a href="https://linktr.ee/hallucinari" target="_blank" rel="noopener noreferrer">linktree</a>
        </div>
    </div>
</body>
</html>
