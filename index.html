<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATRAS Simulator - Standard Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* サイト全体のリセットとベーススタイル */
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f8fafc; /* 上品なスレート背景 */
            color: #334155; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --------------------------------------
           ATRAS専用のインタラクティブUI用CSS
        --------------------------------------- */
        .word-container { 
            position: relative; 
            display: inline-block; 
            margin: 4px 2px; 
        }
        
        /* ドロップダウンメニューの美しいスタイル */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 50;
            min-width: 120px;
            max-height: 250px;
            overflow-y: auto;
            white-space: nowrap;
            margin-top: 4px;
            transform-origin: top left;
        }
        
        /* アニメーション付きのドロップダウン表示 */
        .word-container.active .dropdown { 
            display: block; 
            animation: dropdownFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* カスタムスクロールバー（Webkit） */
        .dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .dropdown::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 8px;
        }
        .dropdown::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 8px;
        }
        .dropdown::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* ドロップダウンアイテム */
        .dropdown-item { 
            padding: 10px 16px; 
            cursor: pointer; 
            border-bottom: 1px solid #f1f5f9; 
            transition: all 0.15s ease;
            font-size: 1.125rem;
        }
        
        .dropdown-item:last-child { 
            border-bottom: none; 
        }
        
        .dropdown-item:hover { 
            background-color: #f8fafc; 
            padding-left: 20px; /* ホバー時に少し右へスライド */
            color: #2563eb;
        }
        
        /* 選択されている単語のハイライト */
        .selected-word {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 0.375rem;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        
        .selected-word:hover { 
            background-color: #e2e8f0; 
        }
        
        /* バリエーションがある単語の破線 */
        .has-variants { 
            border-bottom: 2px dashed #3b82f6; 
        }

        /* --------------------------------------
           入力フォームとスライダーの装飾
        --------------------------------------- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        input[type=range] {
            accent-color: #3b82f6;
            height: 6px;
            border-radius: 4px;
            background: #e2e8f0;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>

            "tc": "🇹🇨", "td": "🇹🇩", "tf": "🇹🇫", "tg": "🇹🇬", "th": "🇹🇭", "tj": "🇹🇯", "tk": "🇹🇰", "tl": "🇹🇱", "tm": "🇹🇲", "tn": "🇹🇳", "to": "🇹🇴", "tr": "🇹🇷", "tt": "🇹🇹", "tv": "🇹🇻", "tw": "🇹🇼", "tz": "🇹🇿",
            "ua": "🇺🇦", "ug": "🇺🇬", "uk": "🇬🇧", "us": "🇺🇸", "uy": "🇺🇾", "uz": "🇺🇿",
            "va": "🇻🇦", "vc": "🇻🇨", "ve": "🇻🇪", "vg": "🇻🇬", "vi": "🇻🇮", "vn": "🇻🇳", "vu": "🇻🇺",
            "wf": "🇼🇫", "ws": "🇼🇸",
            "ye": "🇾🇪", "yt": "🇾🇹",
            "za": "🇿🇦", "zm": "🇿🇲", "zw": "🇿🇼"
        };

        const flagRegex = /[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]/g;

        // 絶対置換ルール: 置換可能なccTLDペアが残っていないか厳密にチェック
        function hasMissedReplacement(variant) {
            const alphaOnlyStr = variant.replace(flagRegex, ' '); 
            const chunks = alphaOnlyStr.split(/\s+/).filter(c => c.length >= 2);
            
            for (let chunk of chunks) {
                for (let i = 0; i < chunk.length - 1; i++) {
                    const c1 = chunk[i];
                    const c2 = chunk[i+1];
                    // ダイアクリティカルマークを含む文字は変換されないためそのまま評価
                    const pair = c1.toLowerCase() + c2.toLowerCase();
                    // 正規のa-zペアが残っている場合のみ置換漏れとする
                    if (cctldFlags[pair] && /^[a-z]{2}$/.test(pair)) {
                        return true; 
                    }
                }
            }
            return false;
        }

        // 最適化スコアの計算
        function calcScore(variant, originalWord, weightQ, weightI, weightR) {
            if (variant === originalWord) return -1000; 

            const flags = variant.match(flagRegex) || [];
            const flagCount = flags.length;
            const maxFlags = Math.floor(originalWord.length / 2);
            
            // 1. 置換量
            const scoreQ = maxFlags > 0 ? (flagCount / maxFlags) : 0;
            
            // 2. 一体感
            let scoreI = 0;
            const alphas = variant.replace(flagRegex, '');
            if (alphas.length > 0) {
                let goodCharCount = 0;
                for (let char of alphas) {
                    let baseChar = char.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                    if (/[iljtILJfbdhk]/.test(baseChar)) {
                        goodCharCount += 1;
                    } else if (/[mwgqp]/.test(baseChar)) {
                        goodCharCount -= 0.5;
                    }
                    if (char.toUpperCase() === char && char.toLowerCase() !== char) {
                        goodCharCount += 0.5;
                    }
                }
                scoreI = Math.max(0, goodCharCount / alphas.length);
            } else if (flagCount > 0 && maxFlags > 0) {
                scoreI = 0.8; // 完全に国旗の場合は高評価
            }
            
            // サンドイッチ構造ボーナス
            if (/^\p{L}+(?:[\uD83C][\uDDE6-\uDDFF]){2,}\p{L}+$/u.test(variant)) {
                scoreI = Math.min(1.0, scoreI + 0.3);
            }

            // 3. 可読性
            let scoreR = 0;
            if (/^\p{L}/u.test(variant)) {
                scoreR += 0.4;
            }
            
            const chunks = variant.replace(flagRegex, ' ').split(/\s+/).filter(c => c.length > 0);
            let maxChunkLen = 0;
            for (let c of chunks) {
                if (c.length > maxChunkLen) maxChunkLen = c.length;
            }
            if (originalWord.length > 0) {
                scoreR += (maxChunkLen / originalWord.length) * 0.6;
            }
            
            return (weightQ * scoreQ) + (weightI * scoreI) + (weightR * scoreR);
        }

        // 有効なすべてのバリエーションを検索
        function findVariations(word, wQ, wI, wR) {
            const results = [];
            const processChars = Array.from(word); // Unicodeセーフな文字配列

            function search(currentPrefix, charIndex) {
                if (charIndex >= processChars.length) {
                    if (currentPrefix !== word) {
                        results.push(currentPrefix);
                    }
                    return;
                }

                // そのまま残す
                const charObj = processChars[charIndex];
                search(currentPrefix + charObj, charIndex + 1);

                // 2文字で置換可能かチェック
                if (charIndex + 1 < processChars.length) {
                    const charObj2 = processChars[charIndex + 1];
                    const potentialCcTLD = charObj.toLowerCase() + charObj2.toLowerCase();
                    
                    // a-zのペアのみ置換対象とする（ダイアクリティカルマークを保護）
                    if (cctldFlags[potentialCcTLD] && /^[a-z]{2}$/.test(potentialCcTLD)) {
                        search(currentPrefix + cctldFlags[potentialCcTLD], charIndex + 2);
                    }
                }
            }

            search("", 0);
            
            let uniqueResults = [...new Set(results)];
            
            // 絶対置換ルール（漏れがあるものは除外）
            uniqueResults = uniqueResults.filter(variant => !hasMissedReplacement(variant));

            // 全て弾かれた場合は元の文字を返す
            if (uniqueResults.length === 0) {
                uniqueResults.push(word);
            } else if (!uniqueResults.includes(word)) {
                uniqueResults.push(word);
            }

            // スコアが高い順にソート
            uniqueResults.sort((a, b) => {
                const scoreA = calcScore(a, word, wQ, wI, wR);
                const scoreB = calcScore(b, word, wQ, wI, wR);
                return scoreB - scoreA;
            });

            return uniqueResults;
        }

        document.addEventListener('DOMContentLoaded', () => {
            
            // 言語切替リスナー
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    applyLanguage(e.target.dataset.lang);
                });
            });
            applyLanguage('ja'); // 初期ロード

            const inputText = document.getElementById('inputText');
            const processBtn = document.getElementById('processBtn');
            const outputArea = document.getElementById('outputArea');
            const finalText = document.getElementById('finalText');
            const copyBtn = document.getElementById('copyBtn');
            
            const paramQ = document.getElementById('paramQ');
            const paramI = document.getElementById('paramI');
            const paramR = document.getElementById('paramR');
            const valQ = document.getElementById('valQ');
            const valI = document.getElementById('valI');
            const valR = document.getElementById('valR');

            let currentSelections = [];

            // スライダー連動
            function updateSliderValues() {
                valQ.textContent = paramQ.value;
                valI.textContent = paramI.value;
                valR.textContent = paramR.value;
            }

            [paramQ, paramI, paramR].forEach(slider => {
                slider.addEventListener('input', () => {
                    updateSliderValues();
                    if (inputText.value.trim() !== '') {
                        processText(); // リアルタイム反映
                    }
                });
            });

            function updateFinalText() {
                finalText.value = currentSelections.join('');
            }

            // メイン処理
            function processText() {
                const text = inputText.value;
                outputArea.innerHTML = '';
                currentSelections = [];
                
                const wQ = parseInt(paramQ.value, 10);
                const wI = parseInt(paramI.value, 10);
                const wR = parseInt(paramR.value, 10);

                // 単語と記号を分離 (\p{L}を利用してダイアクリティカルマーク付きの文字も1つの単語として扱う)
                const tokens = text.match(/\p{L}+|[^\p{L}]+/gu) || [];

                tokens.forEach((token, index) => {
                    // 単語以外はそのまま流し込む
                    if (!/^\p{L}+$/u.test(token)) {
                        outputArea.appendChild(document.createTextNode(token));
                        currentSelections.push(token);
                        return;
                    }

                    // バリエーションを検索
                    const variations = findVariations(token, wQ, wI, wR);
                    
                    if (variations.length > 1) {
                        const container = document.createElement('div');
                        container.className = 'word-container';
                        
                        const displaySpan = document.createElement('span');
                        displaySpan.className = 'selected-word has-variants';
                        
                        const initialChoice = variations[0];
                        displaySpan.textContent = initialChoice;
                        currentSelections.push(initialChoice);
                        const selectionIndex = currentSelections.length - 1;

                        const dropdown = document.createElement('div');
                        dropdown.className = 'dropdown';

                        variations.forEach(variant => {
                            const item = document.createElement('div');
                            item.className = 'dropdown-item';
                            item.textContent = variant;
                            item.addEventListener('click', (e) => {
                                e.stopPropagation();
                                displaySpan.textContent = variant;
                                currentSelections[selectionIndex] = variant;
                                updateFinalText();
                                container.classList.remove('active');
                            });
                            dropdown.appendChild(item);
                        });

                        displaySpan.addEventListener('click', (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.word-container.active').forEach(c => {
                                if (c !== container) c.classList.remove('active');
                            });
                            container.classList.toggle('active');
                        });

                        container.appendChild(displaySpan);
                        container.appendChild(dropdown);
                        outputArea.appendChild(container);

                    } else {
                        // 置換できなかった単語
                        const span = document.createElement('span');
                        span.textContent = token;
                        outputArea.appendChild(span);
                        currentSelections.push(token);
                    }
                });

                updateFinalText();
            }

            processBtn.addEventListener('click', processText);

            // 画面外クリックでドロップダウンを閉じる
            document.addEventListener('click', () => {
                document.querySelectorAll('.word-container.active').forEach(c => {
                    c.classList.remove('active');
                });
            });

            // コピー機能
            copyBtn.addEventListener('click', () => {
                finalText.select();
                document.execCommand('copy');
                
                const originalContent = copyBtn.innerHTML;
                const copiedText = currentLang === 'ja' ? 'コピーしました！' : (currentLang === 'de' ? 'Kopiert!' : 'Copied!');
                
                copyBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>${copiedText}</span>`;
                copyBtn.classList.replace('bg-emerald-500', 'bg-teal-600');
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalContent;
                    copyBtn.classList.replace('bg-teal-600', 'bg-emerald-500');
                }, 2000);
            });
            
            // 初回ロード時にデフォルトテキストを処理
            if(inputText.value.trim() !== '') {
                processText();
            }
        });
    </script>
</body>
</html>
