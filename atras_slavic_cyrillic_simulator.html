<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATRAS Slavic Cyrillic Simulator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .setting-group { display: flex; flex-direction: column; gap: 0.25rem; }
        select { background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.5rem; font-size: 0.875rem; cursor: pointer; }
        select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
        table { border-collapse: collapse; width: 100%; font-size: 0.875rem; background-color: white; }
        th, td { border: 1px solid #e5e7eb; padding: 0.75rem; text-align: left; }
        th { background-color: #f9fafb; font-weight: 600; color: #374151; }
        td.cyrillic-kept { color: #dc2626; font-weight: 600; }
        td.flag-converted { color: #059669; font-size: 1.25rem; }
        td.chain-ready { color: #2563eb; font-weight: 600; }

        #outputArea, #finalText {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            letter-spacing: normal;
            word-spacing: normal;
        }
        
        .word-container { position: relative; display: inline-block; margin: 0; }
        .dropdown {
            display: none; position: absolute; top: 100%; left: 0;
            background-color: white; border: 1px solid #ccc; border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 10;
            min-width: 100%; max-height: 250px; overflow-y: auto; white-space: nowrap;
        }
        .word-container.active .dropdown { display: block; }
        .dropdown-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f3f4f6; font-size: 1.25rem; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background-color: #e5e7eb; }
        
        .selected-word { cursor: pointer; padding: 0; border-radius: 2px; transition: all 0.2s; }
        .selected-word:hover { background-color: #e5e7eb; }
        .has-variants { border-bottom: 2px dashed #3b82f6; padding-bottom: 2px; }

        .lang-selector-container { position: relative; display: inline-block; }
        .lang-selector-btn, .script-toggle-btn {
            display: flex; align-items: center; gap: 0.5rem; background-color: white;
            border: 1px solid #d1d5db; padding: 0.5rem 1rem; border-radius: 0.5rem;
            font-size: 0.875rem; color: #374151; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }
        .lang-selector-btn:hover, .script-toggle-btn:hover { background-color: #f9fafb; border-color: #9ca3af; }
        .lang-menu {
            display: none; position: absolute; right: 0; top: 110%; background-color: white;
            border: 1px solid #e5e7eb; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 50; min-width: 220px; max-height: 400px; overflow-y: auto;
        }
        .lang-selector-container.active .lang-menu { display: block; }
        .lang-option {
            display: block; width: 100%; text-align: left; padding: 0.75rem 1rem;
            font-size: 0.875rem; color: #4b5563; border-bottom: 1px solid #f3f4f6; cursor: pointer;
        }
        .lang-option:last-child { border-bottom: none; }
        .lang-option:hover { background-color: #f3f4f6; color: #111827; }
        .lang-option.selected { background-color: #eff6ff; color: #1d4ed8; font-weight: 600; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-gray-800 flex flex-col items-center">

    <div class="w-full max-w-6xl flex justify-between items-center mb-4">
        <a href="https://hallucinari.github.io/" class="flex items-center gap-1 text-gray-500 hover:text-blue-600 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="font-medium text-sm" data-i18n="backBtn">戻る</span>
        </a>

        <div class="flex items-center gap-2">
            <!-- ラテン/キリル切り替えボタン -->
            <button class="script-toggle-btn hidden" id="scriptToggleBtn" title="Toggle Script">
                <span class="font-bold">B/Б</span>
            </button>
            
            <div class="lang-selector-container" id="langSelector">
                <button class="lang-selector-btn" id="langSelectorBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
                    </svg>
                    <span id="currentLangLabel">日本語</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="lang-menu" id="langMenu">
                    <button class="lang-option selected" data-lang="ja" data-label="日本語">日本語</button>
                    <button class="lang-option" data-lang="en" data-label="English">English</button>
                    <button class="lang-option" data-lang="de" data-label="Deutsch">Deutsch</button>
                    <button class="lang-option" data-lang="ru" data-label="Русский">Русский</button>
                    <button class="lang-option" data-lang="uk" data-label="Українська">Українська</button>
                    <button class="lang-option" data-lang="be" data-label="Беларуская">Беларуская</button>
                    <button class="lang-option" data-lang="bg" data-label="Български">Български</button>
                    <button class="lang-option" data-lang="mk" data-label="Македонски">Македонски</button>
                    <button class="lang-option" data-lang="sr_cyrl" data-label="Српски">Српски</button>
                    <button class="lang-option" data-lang="sh_cyrl" data-label="Српскохрватски">Српскохрватски</button>
                    <button class="lang-option" data-lang="is_cyrl" data-label="Меджусловјански">Меджусловјански</button>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-6xl bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8">
        <h1 class="text-3xl font-bold mb-2 text-center text-blue-600" data-i18n="appTitle">ATRAS Slavic Cyrillic Simulator</h1>
        <p class="text-center text-gray-500 mb-8" data-i18n="subtitle">国際転写規格に完全準拠したスラブ語派ccTLD置換エンジン</p>

        <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-lg mb-6">
            <h2 class="text-base font-bold text-indigo-900 mb-3" data-i18n="presetTitle">一括変換設定</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex flex-col w-full sm:w-1/3">
                    <label class="text-sm font-medium text-gray-700 mb-1" data-i18n="selectLangLbl">1. 対象言語</label>
                    <select id="targetLang" class="rule-select">
                        <option value="ru" data-i18n-opt="lang_ru">ロシア語</option>
                        <option value="uk" data-i18n-opt="lang_uk">ウクライナ語</option>
                        <option value="be" data-i18n-opt="lang_be">ベラルーシ語</option>
                        <option value="bg" data-i18n-opt="lang_bg">ブルガリア語</option>
                        <option value="sr" data-i18n-opt="lang_sr">セルビア語</option>
                        <option value="mk" data-i18n-opt="lang_mk">マケドニア語</option>
                        <option value="all" data-i18n-opt="lang_all">すべて</option>
                    </select>
                </div>
                <div class="flex flex-col w-full sm:w-1/3">
                    <label class="text-sm font-medium text-gray-700 mb-1" data-i18n="selectIdnLbl">2. IDN ccTLDの扱い</label>
                    <select id="globalIdnSetting" class="rule-select">
                        <option value="0" data-i18n-opt="idn_0">両方使用する</option>
                        <option value="1" data-i18n-opt="idn_1">IDNのみ使用</option>
                        <option value="2" data-i18n-opt="idn_2">通常のみ使用</option>
                        <option value="custom" data-i18n-opt="idn_custom" hidden>カスタム</option>
                    </select>
                </div>
                <div class="flex flex-col w-full sm:w-1/3">
                    <label class="text-sm font-medium text-gray-700 mb-1" data-i18n="selectMethLbl">3. 国際規格の選択</label>
                    <select id="translitMethod" class="rule-select">
                        <option value="iso9" data-i18n-opt="meth_iso9">ISO 9:1995 (厳密な1対1・記号付加)</option>
                        <option value="alalc" data-i18n-opt="meth_alalc">ALA-LC (英米式目録規則)</option>
                        <option value="gost" data-i18n-opt="meth_gost">GOST 7.79-2000 System B</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2" data-i18n="idnIndivTitle">国別 IDN ccTLD 設定 (IDN ccTLD / ラテン文字翻字ccTLD)</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_by">🇧🇾 ベラルーシ (.бел/.by)</label>
                    <select id="idn-by" class="idn-select rule-select" data-country="by">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_bg">🇧🇬 ブルガリア (.бг/.bg)</label>
                    <select id="idn-bg" class="idn-select rule-select" data-country="bg">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_eu">🇪🇺 欧州連合 (.ею/.eu)</label>
                    <select id="idn-eu" class="idn-select rule-select" data-country="eu">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_kz">🇰🇿 カザフスタン (.қаз/.kz)</label>
                    <select id="idn-kz" class="idn-select rule-select" data-country="kz">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_mk">🇲🇰 北マケドニア (.мкд/.mk)</label>
                    <select id="idn-mk" class="idn-select rule-select" data-country="mk">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_mn">🇲🇳 モンゴル (.мон/.mn)</label>
                    <select id="idn-mn" class="idn-select rule-select" data-country="mn">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_ru">🇷🇺 ロシア (.рф/.ru)</label>
                    <select id="idn-ru" class="idn-select rule-select" data-country="ru">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_rs">🇷🇸 セルビア (.срб/.rs)</label>
                    <select id="idn-rs" class="idn-select rule-select" data-country="rs">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="text-sm font-medium text-gray-700" data-i18n="lbl_ua">🇺🇦 ウクライナ (.укр/.ua)</label>
                    <select id="idn-ua" class="idn-select rule-select" data-country="ua">
                        <option value="0" data-i18n-opt="idn_0_s">両方</option>
                        <option value="1" data-i18n-opt="idn_1_s">IDNのみ</option>
                        <option value="2" data-i18n-opt="idn_2_s">通常のみ</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-2" data-i18n="tableTitle">現在の言語×規格に基づく置換規則表</h2>
            <div class="overflow-x-auto max-h-[400px] border border-gray-200 rounded-lg">
                <table id="status-table" class="w-full">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th data-i18n="tableH1">キリル文字</th>
                            <th data-i18n="tableH2">規格に基づくラテン転写</th>
                            <th data-i18n="tableH5">ATRAS上の処理挙動</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mb-6">
            <label for="inputText" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="inputLabel">入力テキスト (キリル文字):</label>
            <textarea id="inputText" rows="4" class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-lg" placeholder="文章を入力してください" data-i18n-placeholder="inputPlaceholder"></textarea>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="resultLabel">結果 (破線の下線をクリックしてバリエーションを選択可能):</label>
            <div id="outputArea" class="w-full p-4 min-h-[100px] border border-gray-300 rounded-md bg-gray-50 text-2xl leading-relaxed whitespace-pre-wrap tracking-normal"></div>
        </div>

        <div class="mb-6">
            <label for="finalText" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="outputLabel">最終出力テキスト:</label>
            <textarea id="finalText" rows="4" class="w-full p-3 border border-gray-300 rounded-md shadow-sm bg-gray-100 text-xl tracking-normal" readonly></textarea>
            <div class="mt-3 flex justify-end">
                <button id="copyBtn" class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 transition font-semibold shadow-sm" data-i18n="copyBtn">テキストをコピー</button>
            </div>
        </div>
    </div>

        function getCharMapping(char, lang, std) {
            const lowerChar = char.toLowerCase();
            const rules = translitRules[std];
            
            if (lang === 'all') {
                for (let l of ['ru', 'uk', 'be', 'bg', 'sr', 'mk']) {
                    if (rules[l] && rules[l][lowerChar]) return rules[l][lowerChar];
                }
            } else {
                if (rules[lang] && rules[lang][lowerChar]) return rules[lang][lowerChar];
            }
            if (rules.base[lowerChar]) return rules.base[lowerChar];
            return lowerChar;
        }

        function evaluateTransliteration(char, latResult, activeLatinFlags) {
            const t = translations[currentLang] || translations['ja'];
            const hasNonAlpha = /[^a-z]/i.test(latResult);

            if (hasNonAlpha) {
                return { lat: latResult, isolated: true, flag: null, kept: true, reason: t.tbResKept };
            }
            
            // ALA-LC の「shch」特例 (🇸🇭🇨🇭に置換)
            if (latResult === 'shch') {
                const s1 = activeLatinFlags['sh'] || '';
                const s2 = activeLatinFlags['ch'] || '';
                if (s1 && s2) {
                    return { lat: 'shch', isolated: true, flag: s1 + s2, kept: false, reason: t.tbResShch || '🇸🇭🇨🇭に確定置換' };
                }
            }

            if (latResult.length === 1) {
                return { lat: latResult, isolated: false, flag: null, kept: false, reason: t.tbResChain };
            }
            if (latResult.length === 2) {
                if (activeLatinFlags[latResult]) {
                    return { lat: latResult, isolated: true, flag: activeLatinFlags[latResult], kept: false, reason: t.tbResSingle };
                } else {
                    return { lat: latResult, isolated: true, flag: null, kept: true, reason: t.tbResKept };
                }
            }
            return { lat: latResult, isolated: true, flag: null, kept: true, reason: t.tbResKept };
        }

        function updateTable() {
            const lang = document.getElementById('targetLang').value;
            const std = document.getElementById('translitMethod').value;
            const tbody = document.querySelector('#status-table tbody');
            tbody.innerHTML = '';
            
            const activeLatinFlags = { ...masterCctldFlags };
            Object.keys(idnMap).forEach(country => {
                const sel = document.getElementById('idn-' + country);
                if (sel && sel.value === "1") {
                    delete activeLatinFlags[idnMap[country].lat];
                }
            });

            const currentAlphabet = alphabets[lang];

            for (let i=0; i<currentAlphabet.length; i++) {
                const char = currentAlphabet[i];
                const latResult = getCharMapping(char, lang, std);
                const evalData = evaluateTransliteration(char, latResult, activeLatinFlags);

                const tr = document.createElement('tr');
                const tdChar = document.createElement('td'); tdChar.textContent = char.toUpperCase() + ', ' + char; tr.appendChild(tdChar);
                const tdVal = document.createElement('td'); tdVal.textContent = latResult; tr.appendChild(tdVal);

                const tdResult = document.createElement('td');
                if (evalData.kept) {
                    tdResult.innerHTML = `<span class="cyrillic-kept">${char}</span> <span class="text-xs text-gray-500 ml-1">${evalData.reason}</span>`;
                } else if (evalData.flag) {
                    tdResult.innerHTML = `<span class="flag-converted">${evalData.flag}</span> <span class="text-xs text-gray-500 ml-1">${evalData.reason}</span>`;
                } else {
                    tdResult.innerHTML = `<span class="chain-ready">${latResult}</span> <span class="text-xs text-gray-500 ml-1">${evalData.reason}</span>`;
                }
                tr.appendChild(tdResult);
                tbody.appendChild(tr);
            }
        }

        function applyLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('currentLangLabel').textContent = label;

            let baseLangForMenu = lang;
            if (lang === 'sr_latn') baseLangForMenu = 'sr_cyrl';
            if (lang === 'sh_latn') baseLangForMenu = 'sh_cyrl';
            if (lang === 'is_latn') baseLangForMenu = 'is_cyrl';

            document.querySelectorAll('.lang-option').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.lang === baseLangForMenu);
            });

            const toggleBtn = document.getElementById('scriptToggleBtn');
            if (scriptPairs[lang]) {
                toggleBtn.classList.remove('hidden');
            } else {
                toggleBtn.classList.add('hidden');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang][key]) el.innerHTML = translations[lang][key];
            });

            document.querySelectorAll('option[data-i18n-opt], label[data-i18n-opt]').forEach(el => {
                const key = el.dataset.i18nOpt || el.dataset.i18n;
                if (key && translations[lang][key]) el.textContent = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });

            Object.keys(idnMap).forEach(k => {
                const lbl = document.querySelector(`[data-i18n="lbl_${k}"]`);
                if(lbl && translations[lang][`lbl_${k}`]) lbl.textContent = translations[lang][`lbl_${k}`];
            });

            updateTable();
            processAtras();
        }

        function processAtras() {

            const activeLang = document.getElementById('targetLang').value;
            const std = document.getElementById('translitMethod').value;

            const activeLatinFlags = { ...masterCctldFlags };
            const activeCyrillicFlags = {};

            Object.keys(idnMap).forEach(country => {
                const sel = document.getElementById('idn-' + country);
                const val = sel ? sel.value : "0";
                const data = idnMap[country];
                if (val === "1") {
                    delete activeLatinFlags[data.lat];
                    activeCyrillicFlags[data.cyr] = data.flag;
                } else if (val === "2") {
                } else {
                    activeCyrillicFlags[data.cyr] = data.flag;
                }
            });

            const tokens = [];
            let currentWordNodes = [];
            let currentNonWord = "";
            const isCyrillic = (c) => /[\u0400-\u04FF]/u.test(c);

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (isCyrillic(c)) {
                    if (currentNonWord.length > 0) {
                        tokens.push({ type: 'non-word', text: currentNonWord });
                        currentNonWord = "";
                    }
                    
                    const lat = getCharMapping(c, activeLang, std);
                    const evalData = evaluateTransliteration(c, lat, activeLatinFlags);
                    
                    currentWordNodes.push({
                        char: c, lat: evalData.lat, isolated: evalData.isolated, flag: evalData.flag, kept: evalData.kept
                    });
                } else {
                    if (currentWordNodes.length > 0) {
                        tokens.push({ type: 'word', nodes: currentWordNodes });
                        currentWordNodes = [];
                    }
                    currentNonWord += c;
                }
            }
            if (currentWordNodes.length > 0) tokens.push({ type: 'word', nodes: currentWordNodes });
            if (currentNonWord.length > 0) tokens.push({ type: 'non-word', text: currentNonWord });

            function findVariations(nodes) {
                const resultsMap = new Map();
                const originalWord = nodes.map(n => n.char).join('');

                function search(currentPrefix, nodeIndex, unconvertedList) {
                    if (nodeIndex === nodes.length) {
                        let missed = false;
                        const unconvCyr = unconvertedList.map(n => n.char).join('').toLowerCase();
                        
                        for (let idn of Object.keys(activeCyrillicFlags)) {
                            if (unconvCyr.includes(idn)) { missed = true; break; }
                        }

                        if (!missed) {
                            for (let i = 0; i < unconvertedList.length - 1; i++) {
                                const n1 = unconvertedList[i];
                                const n2 = unconvertedList[i + 1];
                                if (n2.index === n1.index + 1 && !n1.kept && !n2.kept) {
                                    const pair = (n1.lat + n2.lat).toLowerCase();
                                    if (activeLatinFlags[pair]) { missed = true; break; }
                                }
                            }
                        }
                        if (!missed) resultsMap.set(currentPrefix, true);
                        return;
                    }

                    const node = nodes[nodeIndex];
                    node.index = nodeIndex;

                    if (node.isolated) {
                        if (node.flag) {
                            search(currentPrefix + node.flag, nodeIndex + 1, unconvertedList);
                        } else {
                            search(currentPrefix + node.char, nodeIndex + 1, unconvertedList);
                        }
                        return;
                    }

                    search(currentPrefix + node.char, nodeIndex + 1, [...unconvertedList, node]);

                    if (nodeIndex + 1 < nodes.length && !nodes[nodeIndex + 1].isolated && !nodes[nodeIndex + 1].kept) {
                        const nextNode = nodes[nodeIndex + 1];
                        const pair = (node.lat + nextNode.lat).toLowerCase();
                        if (activeLatinFlags[pair]) {
                            search(currentPrefix + activeLatinFlags[pair], nodeIndex + 2, unconvertedList);
                        }
                    }

                    if (nodeIndex + 1 < nodes.length) {
                        const cyr2 = (node.char + nodes[nodeIndex + 1].char).toLowerCase();
                        if (activeCyrillicFlags[cyr2]) {
                            search(currentPrefix + activeCyrillicFlags[cyr2], nodeIndex + 2, unconvertedList);
                        }
                    }

                    if (nodeIndex + 2 < nodes.length) {
                        const cyr3 = (node.char + nodes[nodeIndex + 1].char + nodes[nodeIndex + 2].char).toLowerCase();
                        if (activeCyrillicFlags[cyr3]) {
                            search(currentPrefix + activeCyrillicFlags[cyr3], nodeIndex + 3, unconvertedList);
                        }
                    }
                }

                search("", 0, []);
                let uniqueResults = Array.from(resultsMap.keys());
                uniqueResults.sort((a, b) => {
                    const flagsA = (a.match(/[\uD83C][\uDDE6-\uDDFF]/g) || []).length / 2;
                    const flagsB = (b.match(/[\uD83C][\uDDE6-\uDDFF]/g) || []).length / 2;
                    return flagsB - flagsA;
                });

                if (!uniqueResults.includes(originalWord)) uniqueResults.push(originalWord);
                return uniqueResults;
            }

            tokens.forEach((token) => {
                if (token.type === 'non-word') {
                    outputArea.appendChild(document.createTextNode(token.text));
                    currentSelections.push(token.text);
                } else {
                    const variations = findVariations(token.nodes);
                    if (variations.length === 1) {
                        outputArea.appendChild(document.createTextNode(variations[0]));
                        currentSelections.push(variations[0]);
                    } else {
                        const container = document.createElement('div');
                        container.className = 'word-container';
                        
                        const displaySpan = document.createElement('span');
                        displaySpan.className = 'selected-word has-variants';
                        
                        const initialChoice = variations[0];
                        displaySpan.textContent = initialChoice;
                        currentSelections.push(initialChoice);
                        const selectionIndex = currentSelections.length - 1;

                        const dropdown = document.createElement('div');
                        dropdown.className = 'dropdown';

                        variations.forEach(variant => {
                            const item = document.createElement('div');
                            item.className = 'dropdown-item';
                            item.textContent = variant;
                            item.addEventListener('click', (e) => {
                                e.stopPropagation();
                                displaySpan.textContent = variant;
                                currentSelections[selectionIndex] = variant;
                                updateFinalText();
                                container.classList.remove('active');
                            });
                            dropdown.appendChild(item);
                        });

                        displaySpan.addEventListener('click', (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.word-container.active').forEach(c => {
                                if (c !== container) c.classList.remove('active');
                            });
                            container.classList.toggle('active');
                        });

                        container.appendChild(displaySpan);
                        container.appendChild(dropdown);
                        outputArea.appendChild(container);
                    }
                }
            });
            updateFinalText();
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.word-container.active').forEach(c => c.classList.remove('active'));
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const finalText = document.getElementById('finalText');
            finalText.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
            const originalText = btn.textContent;
            const t = translations[currentLang] || translations['ja'];
            btn.textContent = t.copiedBtn;
            btn.classList.replace('bg-green-600', 'bg-teal-600');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.replace('bg-teal-600', 'bg-green-600');
            }, 2000);
        });

        updateTable();
        applyLanguage('ja', '日本語');
    </script>
</body>
</html>
